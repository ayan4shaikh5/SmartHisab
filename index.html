<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartHisab - Ultimate 3D Expense Tracker</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- 🟢 GSAP & ScrollTrigger Libraries (The Magic Ingredients for 3D Animations) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    /* ==========================================================================
       EXTREME 3D GLASSMORPHISM & NEON LIGHTING SYSTEM
       ========================================================================== */
    :root {
      --bg: #02040a;
      --surface: rgba(10, 15, 30, 0.4);
      --surface-soft: rgba(20, 25, 45, 0.5);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --income: #34d399;
      --income-grad: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --expense: #fb7185;
      --expense-grad: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      --shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
      --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy 3D Spring */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
    html, body { overflow-x: hidden !important; width: 100vw; background-color: var(--bg); color: var(--text); }
    body { min-height: 100vh; padding-bottom: 115px; perspective: 1000px; /* Enable 3D Space */ }

    /* 🌌 The 3D WebGL Canvas Background */
    #spaceCanvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;
      background: radial-gradient(circle at center, #0a0d1a 0%, #02040a 100%);
    }

    /* 📱 Main App Shell with 3D Depth */
    .app-shell { max-width: 480px; margin: 0 auto; padding: 12px 16px 32px; position: relative; z-index: 2; transform-style: preserve-3d; }

    /* 🛸 Top Bar (Floating Glass) */
    .top-bar { 
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 12px; 
      background: var(--surface); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); 
      border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); 
      transform: translateZ(20px); /* Lifted off background */
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .app-logo { width: 45px; height: 45px; border-radius: 14px; box-shadow: 0 0 20px rgba(16,185,129,0.5); }
    .brand-title h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.2rem; font-weight: 900; background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-title p { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    /* ⚡ Hero Titanium Card (Full 3D Hover/Gyro) */
    .hero-wrapper {
      position: relative; border-radius: 30px; padding: 2px; margin-bottom: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.02));
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      transform-style: preserve-3d; transition: transform 0.1s linear; cursor: grab;
      /* GSAP Target Class */
      opacity: 0; transform: translateY(50px) rotateX(-20deg);
    }
    .hero-card {
      background: linear-gradient(145deg, rgba(15,23,42,0.8), rgba(6,9,19,0.9));
      backdrop-filter: blur(40px); border-radius: 28px; padding: 25px 20px; position: relative; z-index: 1; overflow: hidden;
    }
    /* Volumetric Light Sweep */
    .hero-card::after {
      content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.15) 50%, transparent 55%);
      animation: sweep 4s infinite linear; pointer-events: none;
    }
    @keyframes sweep { 0% { transform: translate(-30%, -30%) rotate(45deg); } 100% { transform: translate(30%, 30%) rotate(45deg); } }

    .balance-label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transform: translateZ(30px); }
    .balance-amount { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 3.2rem; font-weight: 900; margin: 5px 0 20px; color: #fff; text-shadow: 0 10px 30px rgba(255,255,255,0.3); transform: translateZ(50px); } /* Popping out in 3D */

    .hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; transform: translateZ(20px); }
    .hero-metric { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); }
    .metric-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; }
    .metric-in { background: rgba(16, 185, 129, 0.2); color: #34d399; box-shadow: 0 0 20px rgba(16,185,129,0.3); }
    .metric-out { background: rgba(244, 63, 94, 0.2); color: #fb7185; box-shadow: 0 0 20px rgba(244,63,94,0.3); }

    /* 🧲 Magnetic Action Buttons */
    .big-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; opacity: 0; }
    .magnetic-btn {
      border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 18px 10px; color: #fff; font-size: 1.05rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; transition: transform 0.3s var(--spring), box-shadow 0.3s ease;
      transform-style: preserve-3d; /* For GSAP */
    }
    .magnetic-btn:hover { transform: scale(1.05) translateZ(20px); }
    .magnetic-btn:active { transform: scale(0.9); }
    .btn-income { background: var(--income-grad); box-shadow: 0 15px 30px rgba(16,185,129,0.4); }
    .btn-expense { background: var(--expense-grad); box-shadow: 0 15px 30px rgba(244,63,94,0.4); }

    /* 🧊 Bento Glass Panels (ScrollTrigger Targets) */
    .panel { 
      background: var(--surface); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; 
      /* Hidden initially for GSAP ScrollTrigger */
      opacity: 0; transform: translateY(40px) scale(0.95);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-title { font-size: 1.05rem; font-weight: 800; }

    /* 🎁 Floating 3D Loot Pill */
    .floating-loot-pill {
      position: fixed; bottom: 85px; right: 20px; z-index: 100;
      background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 2px solid #8b5cf6; border-radius: 99px; padding: 14px 22px; color: #fff; font-weight: 900; font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 15px 35px rgba(139,92,246,0.6), inset 0 0 15px rgba(139,92,246,0.4);
      animation: floatPill 3s infinite ease-in-out;
    }
    @keyframes floatPill { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }

    /* 📱 Bottom Nav Dock */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,8,15,0.8); backdrop-filter: blur(40px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 10px 20px; max-width: 480px; margin: 0 auto; z-index: 99; border-radius: 30px 30px 0 0;
      transform: translateY(100%); /* Animated by GSAP on load */
    }
    .nav-item { background: transparent; border: none; color: var(--muted); font-size: 0.75rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
    .nav-item.active { color: #34d399; transform: translateY(-5px) scale(1.1); }
    .nav-item span.nav-icon { font-size: 1.4rem; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Forms & Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); display: none; align-items: flex-end; justify-content: center; z-index: 200; opacity: 0; transition: opacity 0.3s ease; }
    .modal-backdrop.open { display: flex; opacity: 1; }
    .modal-sheet { background: var(--bg); border-top: 1px solid var(--border-highlight); width: 100%; max-width: 480px; border-radius: 35px 35px 0 0; padding: 25px 20px 40px; box-shadow: 0 -20px 60px rgba(99,102,241,0.4); transform: translateY(100%); transition: transform 0.4s var(--spring); }
    .modal-backdrop.open .modal-sheet { transform: translateY(0); }
    
    .form-input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; font-weight: 700; outline: none; margin-bottom: 16px; transition: border 0.3s; }
    .form-input:focus { border-color: #6366f1; background: rgba(99,102,241,0.1); }
    .amount-input-big { font-size: 1.8rem; font-weight: 900; color: #fbbf24; }

  </style>
</head>

    </button>
    <button class="nav-item" onclick="haptic(10)">
      <span class="nav-icon">📸</span><span>Flex</span>
    </button>
  </nav>

  <!-- ==========================================================================
       ⚙️ THE BEAST ENGINES: WebGL Canvas, GSAP ScrollTrigger, Haptics & Magnetics
       ========================================================================== -->
  <script>
    // 📳 1. Advanced Haptic Vibration Engine
    function haptic(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    // 🌌 2. TRUE 3D SPACE CANVAS (Stars & Nebula Engine)
    (function initSpaceCanvas() {
      const canvas = document.getElementById('spaceCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      let stars = [];

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Generate 150 3D Stars
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          z: Math.random() * 2, // 3D Depth
          radius: Math.random() * 1.5,
          alpha: Math.random()
        });
      }

      function animateSpace() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(star => {
          // Move stars up to create forward movement illusion
          star.y -= star.z * 0.5;
          if (star.y < 0) { star.y = height; star.x = Math.random() * width; }
          
          // Twinkle effect
          star.alpha += (Math.random() - 0.5) * 0.1;
          star.alpha = Math.max(0.1, Math.min(1, star.alpha));

          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius * star.z, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(animateSpace);
      }
      animateSpace();
    })();

    // ⚡ 3. 3D GYROSCOPE & MOUSE TILT ENGINE (For Hero Card)
    (function initTilt() {
      const card = document.getElementById('heroTiltCard');
      if(!card) return;

      function applyTilt(rotX, rotY) {
        // Extreme 3D Depth transformation
        card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.02, 1.02, 1.02) translateZ(30px)`;
      }

      // Mouse Hover Physics
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        applyTilt(-(y / (rect.height / 2)) * 15, (x / (rect.width / 2)) * 15);
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1) translateZ(0px)`;
      });

      // Phone Gyroscope Physics
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (!e.gamma || !e.beta) return;
          const x = Math.max(-45, Math.min(45, e.gamma)); 
          const y = Math.max(-45, Math.min(45, e.beta));
          applyTilt(-(y - 40) * 0.6, x * 0.6);
        });
      }
    })();

    // 🧲 4. MAGNETIC BUTTONS (Cursor pull physics)
    document.querySelectorAll('.magnetic-btn').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = (e.clientX - rect.left) - rect.width / 2;
        const y = (e.clientY - rect.top) - rect.height / 2;
        // Pull the button towards the cursor
        btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) translateZ(20px)`;
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = `translate(0px, 0px) translateZ(0px)`;
      });
    });

    // 🟢 5. GSAP & SCROLLTRIGGER ANIMATIONS (The Awwwards Secret)
    document.addEventListener("DOMContentLoaded", (event) => {
      gsap.registerPlugin(ScrollTrigger);

      // Load Animations (When page opens)
      const tl = gsap.timeline();
      
      // Top Bar drops in
      tl.fromTo(".gs-fade-down", {y: -50, opacity: 0}, {y: 0, opacity: 1, duration: 1, ease: "elastic.out(1, 0.5)"});
      
      // Hero Card flips in 3D
      tl.to(".gs-hero", {opacity: 1, y: 0, rotateX: 0, duration: 1.2, ease: "power4.out"}, "-=0.6");
      
      // Action buttons pop up
      tl.to(".gs-btns", {opacity: 1, duration: 0.5}, "-=0.8");
      tl.fromTo(".magnetic-btn", {y: 30, scale: 0.8}, {y: 0, scale: 1, stagger: 0.1, duration: 0.8, ease: "back.out(1.7)"}, "-=0.8");
      
      // Bottom Nav slides up
      tl.to(".gs-nav", {y: 0, duration: 0.8, ease: "power3.out"}, "-=1");

      // ScrollTrigger Animations (When scrolling down)
      gsap.utils.toArray('.gs-panel').forEach(panel => {
        gsap.to(panel, {
          scrollTrigger: {
            trigger: panel,
            start: "top 90%", // Trigger when top of panel hits 90% of screen
            toggleActions: "play none none reverse"
          },
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.8,
          ease: "back.out(1.2)"
        });
      });
    });

    // Simple Open Modal Logic Placeholder
    function openEntryModal(type) {
      alert(`Opening ${type} modal in full 3D version...`);
    }
  </script>
</body>
